# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration for lvdsim.
#
# NOTE: this workflow was written and its commands were dry-run by hand in a Debian environment, but the
# workflow itself has never been executed on GitHub. Expect to fix small things on the first run.
#
# What it covers: libwave (plain C++20, no Qt) and the command line tools, built with -Wall -Wextra -Werror,
# plus their unit tests (Catch2), and the licence-header check. What it does NOT cover:
#   - the Qt GUI and its QTest suite (needs a Qt 6.8+ install; see the TODO job at the bottom),
#   - the NVC kernel (a separate build, see docs/getting-the-kernel.md): the integration tests of the tools
#     and the library-script test find no nvc and report "skipped", which ctest counts as not failed.
#
# Network: the first configure downloads zlib 1.3.1 and Catch2 3.7.1 with CMake FetchContent from GitHub.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    name: licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX lines
        run: python3 scripts/check-headers.py

  linux:
    name: linux (tools and libwave)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git

      # The linux-debug preset puts the build directory in $HOME/build/lvdsim/linux-debug and is only
      # enabled on Linux. The GUI is off by default; it is stated here for clarity.
      - name: Configure
        run: cmake --preset linux-debug -DLVDSIM_BUILD_GUI=OFF

      - name: Build
        run: cmake --build --preset linux-debug -j"$(nproc)"

      - name: Test
        run: ctest --preset linux-debug

  windows:
    name: windows (MinGW-w64 from MSYS2, tools and libwave)
    runs-on: windows-latest
    # The mingw presets of this repository point at a Qt installation on the maintainer's machine
    # (C:/Qt/Tools/mingw1310_64), so they cannot be used here. This job configures without presets and uses
    # the MSYS2 MinGW-w64 compiler. Never run on GitHub yet: it may fail for reasons of the runner, which is
    # why it does not block the other jobs.
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLVDSIM_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  # TODO (maintainer): GUI job. It needs a Qt 6.8 or newer installation (Qt Widgets, Network, Test; the
  # RHI renderer also needs the Qt private headers and the shader tools on Linux, see docs/building-linux.md)
  # and QT_QPA_PLATFORM=offscreen for the QTest suite. It is left out on purpose: no Qt installer action
  # was verified when this file was written, and a guessed version tag would make the workflow fail. A
  # starting point on Ubuntu 24.04, whose Qt is 6.4 and therefore too old, is a Qt install action pinned to
  # a full commit SHA or an existing release tag, then:
  #   cmake --preset linux-debug -DLVDSIM_BUILD_GUI=ON
  #   cmake --build --preset linux-debug -j"$(nproc)"
  #   QT_QPA_PLATFORM=offscreen ctest --preset linux-debug
